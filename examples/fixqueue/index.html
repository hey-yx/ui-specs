<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FixQueue · 一线工单台账</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tdesign-react@1.18.6/dist/tdesign.css">
<style>
/* Hallmark · macrostructure: Stat-Led · tone: utilitarian-dense · anchor hue: blue
 * theme: TDesign palette (Blue7 #0052d9 accent) · nav: N13 inline ⌘K search pill · footer: Ft2 inline rule
 * H4 knobs: number=tabular display 64px · qualifier=inline-right · secondary stats=row of four
 * pre-emit critique: P5 H5 E5 S5 R4 V4
 */
:root{
  /* colour — TDesign 色板原文值，行号见 DECISIONS.md §3 */
  --paper:#f3f3f3;
  --surface:#ffffff;
  --rule:#e8e8e8;
  --rule-2:#dddddd;
  --border-control:#8b8b8b;
  --ink:#181818;
  --ink-2:#5e5e5e;
  --ink-off:#a6a6a6;
  --brand:#0052d9;
  --brand-hover:#003cab;
  --brand-weak:#f2f3ff;
  --danger:#ad352f;
  --danger-weak:#fff0ed;
  --warn:#954500;
  --warn-weak:#fff1e9;
  --ok:#006c45;
  --ok-weak:#e3f9e9;
  --seg-new:#e37318;
  --seg-doing:#366ef4;
  --seg-done:#2ba471; --seg-resolved:#2ba471;
  --seg-closed:#8b8b8b;
  /* type — TDesign 第一二字节，行高 = 字号 + 8 */
  --t12:12px; --lh12:20px;
  --t14:14px; --lh14:22px;
  --t16:16px; --lh16:24px;
  --t20:20px; --lh20:28px;
  --t24:24px; --lh24:32px;
  --t36:36px; --lh36:44px;
  --t64:64px; --lh64:72px;
  /* space — 8 点网格加 4 / 12 两档小间距 */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  /* radius — 基准规范无通用圆角篇，派生两档 */
  --r4:4px; --r8:8px;
  /* motion — TDesign 桌面端固定时值与缓动 */
  --dur-base:200ms; --dur-moderate:240ms; --dur-slow:280ms;
  --ease-standard:cubic-bezier(.38,0,.24,1);
  --ease-out:cubic-bezier(0,0,.15,1);
  --ease-in:cubic-bezier(0.82,0,1,.9);
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans GB","Microsoft YaHei UI","Microsoft YaHei","Source Han Sans CN",sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  /* TDesign 组件变量映射到基准规范值 */
  --td-brand-color:var(--brand);
  --td-brand-color-hover:var(--brand-hover);
  --td-brand-color-active:#002a7c;
  --td-brand-color-focus:var(--brand-weak);
  --td-brand-color-light:var(--brand-weak);
  --td-brand-color-light-hover:#d9e1ff;
  --td-brand-color-1:#f2f3ff;
  --td-brand-color-2:#d9e1ff;
  --td-brand-color-3:#b5c7ff;
  --td-brand-color-4:#8eabff;
  --td-brand-color-5:#618dff;
  --td-brand-color-6:#366ef4;
  --td-brand-color-7:#0052d9;
  --td-brand-color-8:#003cab;
  --td-error-color:var(--danger);
  --td-error-color-hover:#881f1c;
  --td-error-color-focus:var(--danger-weak);
  --td-error-color-light:var(--danger-weak);
  --td-warning-color:var(--warn);
  --td-warning-color-focus:var(--warn-weak);
  --td-warning-color-light:var(--warn-weak);
  --td-success-color:var(--ok);
  --td-success-color-focus:var(--ok-weak);
  --td-success-color-light:var(--ok-weak);
  --td-text-color-primary:var(--ink);
  --td-text-color-secondary:var(--ink-2);
  --td-text-color-placeholder:var(--ink-2);
  --td-text-color-disabled:var(--ink-off);
  --td-border-level-1-color:var(--rule);
  --td-border-level-2-color:var(--border-control);
  --td-component-border:var(--border-control);
  --td-bg-color-page:var(--paper);
  --td-bg-color-container:var(--surface);
  --td-bg-color-secondarycontainer:#f3f3f3;
  --td-radius-small:var(--r4);
  --td-radius-default:var(--r4);
  --td-radius-medium:var(--r8);
  --td-font-family:var(--font-ui);
  --td-font-family-medium:var(--font-ui);
}
*,*::before,*::after{box-sizing:border-box}
html,body{overflow-x:clip}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--font-ui);font-size:var(--t14);line-height:var(--lh14);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
h1,h2,h3,p,dl,dd,ul,ol{margin:0;padding:0}
ul,ol{list-style:none}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:2px}
:where(a,button,input,textarea,[tabindex]):focus-visible,
.t-button:focus-visible,
.t-input__inner:focus-visible,
.t-checkbox__input:focus-visible ~ .t-checkbox__label::before{
  outline:2px solid var(--brand);outline-offset:2px;border-radius:var(--r4);
}
.skip{
  position:absolute;inset-inline-start:var(--s4);top:-56px;z-index:90;
  background:var(--surface);color:var(--ink);padding:var(--s2) var(--s4);
  border:1px solid var(--border-control);border-radius:var(--r4);
  font-size:var(--t14);line-height:var(--lh14);transition:top var(--dur-base) var(--ease-out);
}
.skip:focus{top:var(--s2)}
.wrap{width:100%;max-width:1440px;margin:0 auto;padding-inline:var(--s4)}

/* ── 页头 N13 ───────────────────────────────────────────── */
.nav{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--rule)}
.nav__in{display:flex;align-items:center;gap:var(--s3);height:56px}
.brand{display:flex;align-items:baseline;gap:var(--s2);flex:0 0 auto;color:var(--ink);text-decoration:none}
.brand:hover{text-decoration:none}
.brand__mark{font-size:var(--t16);line-height:var(--lh16);font-weight:600;letter-spacing:-.01em}
.brand__q{font-size:var(--t12);line-height:var(--lh12);color:var(--ink-2)}
.duty{display:none;align-items:center;gap:var(--s2);font-size:var(--t12);line-height:var(--lh12);color:var(--ink-2);min-width:0}
.duty b{color:var(--ink);font-weight:600}
.duty__dot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:0 0 auto}
.duty__sep{color:var(--rule-2)}
.nav__spacer{flex:1 1 auto}
.searchpill{
  display:none;align-items:center;gap:var(--s2);
  height:32px;padding:0 var(--s2) 0 var(--s3);max-width:360px;flex:1 1 auto;
  background:var(--paper);border:1px solid var(--border-control);border-radius:999px;
  color:var(--ink-2);font:inherit;font-size:var(--t12);line-height:var(--lh12);cursor:pointer;
  transition:border-color var(--dur-base) var(--ease-standard),background var(--dur-base) var(--ease-standard);
}
.searchpill:hover{border-color:var(--ink-2);background:var(--surface)}
.searchpill svg{flex:0 0 auto}
.searchpill__txt{flex:1 1 auto;text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kbd{
  display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 4px;
  border:1px solid var(--rule-2);border-radius:var(--r4);background:var(--surface);
  font-family:var(--font-mono);font-size:11px;line-height:16px;color:var(--ink-2);
}
.iconbtn{
  display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;
  background:var(--surface);border:1px solid var(--border-control);border-radius:var(--r4);color:var(--ink);cursor:pointer;
}
.nav__new{flex:0 0 auto}

/* ── 首屏 Stat-Led ──────────────────────────────────────── */
.hero{padding-block:var(--s4) var(--s4);border-bottom:1px solid var(--rule);display:grid;gap:var(--s2)}
.hero__h{display:flex;align-items:baseline;flex-wrap:wrap;gap:var(--s2) var(--s3);font-size:var(--t20);line-height:var(--lh20);font-weight:600;max-width:52ch}
.hero__figure{
  font-size:var(--t36);line-height:var(--lh36);font-weight:600;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;
}
.hero__words{color:var(--ink)}
.hero__note{color:var(--ink-2);font-size:var(--t12);line-height:var(--lh12);max-width:72ch}

/* 状态计数：可点的四格 */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:var(--r8);overflow:hidden}
.stat{
  display:flex;flex-direction:column;gap:2px;align-items:flex-start;
  padding:var(--s2) var(--s4) var(--s3);background:var(--surface);border:0;border-bottom:2px solid transparent;
  font:inherit;text-align:start;cursor:pointer;
  transition:background var(--dur-base) var(--ease-standard),border-color var(--dur-base) var(--ease-standard);
}
.stat:hover{background:var(--paper)}
.stat[aria-pressed="true"]{border-bottom-color:var(--brand);background:var(--brand-weak)}
.stat__n{font-size:var(--t24);line-height:var(--lh24);font-weight:600;font-variant-numeric:tabular-nums}
.stat__l{display:flex;align-items:center;gap:6px;color:var(--ink-2);font-size:var(--t12);line-height:var(--lh12)}
.swatch{width:8px;height:8px;border-radius:2px;flex:0 0 auto}
.swatch--new{background:var(--seg-new)}
.swatch--doing{background:var(--seg-doing)}
.swatch--resolved{background:var(--seg-done)}
.swatch--closed{background:var(--seg-closed)}

/* 分布条 + 图例 */
.dist{display:grid;gap:var(--s3);align-content:start}
.dist__bar{display:flex;gap:2px;height:12px;border-radius:var(--r4);overflow:hidden;background:var(--rule)}
.dist__seg{height:100%;min-width:2px}
.dist__legend{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s4);font-size:var(--t12);line-height:var(--lh12);color:var(--ink-2)}
.dist{margin-top:var(--s3)}
.dist__item{display:flex;align-items:center;gap:6px}
.dist__item b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

/* ── 台账卡片 ───────────────────────────────────────────── */
.ledger{
  margin-block:var(--s3) var(--s4);background:var(--surface);
  border:1px solid var(--rule);border-radius:var(--r8);overflow:hidden;
}
.ledger .t-table__content{overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain}
.ledger .t-table__content:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.ledger .t-table__content > table{min-width:1080px}
.ledger__head{
  display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--s2) var(--s3);
  padding:var(--s3) var(--s4) 0;
}
.ledger__t{font-size:var(--t16);line-height:var(--lh16);font-weight:600}
.ledger__n{font-size:var(--t12);line-height:var(--lh12);color:var(--ink-2);font-variant-numeric:tabular-nums}
.ledger__hint{margin-inline-start:auto;font-size:var(--t12);line-height:var(--lh12);color:var(--ink-2)}

/* 工具栏 */
.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2) var(--s3);padding:var(--s3) var(--s4);align-items:end}
.toolbar__search{grid-column:1 / -1}
.toolbar__tail{grid-column:1 / -1;display:flex;gap:var(--s2);align-items:center;justify-content:space-between}
.toolbar .t-input__wrap,.toolbar .t-select{width:100%}
.fieldlabel{display:block;margin-bottom:var(--s1);font-size:var(--t12);line-height:var(--lh12);color:var(--ink-2)}

/* 批量操作条 */
.selbar{
  display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2) var(--s3);
  padding:var(--s2) var(--s4);background:var(--brand-weak);
  border-block:1px solid #d9e1ff;font-size:var(--t12);line-height:var(--lh12);color:var(--ink);
}
.selbar b{font-variant-numeric:tabular-nums}
.selbar .grow{flex:1 1 auto}

/* 表格 */
.tblnote{margin:0;padding:0 var(--s4) var(--s3);font-size:var(--t12);line-height:var(--lh12);color:var(--ink-2)}
.t-ledger .t-table__content{overflow-x:auto;scrollbar-width:thin;scrollbar-color:var(--ink-off) var(--paper)}
.t-ledger .t-table__content::-webkit-scrollbar{height:10px}
.t-ledger .t-table__content::-webkit-scrollbar-thumb{background:var(--ink-off);border-radius:5px}
.t-ledger .t-table__content::-webkit-scrollbar-track{background:var(--paper)}
.t-ledger{--td-table-header-bg:var(--paper)}
.t-ledger .t-table{color:var(--ink)}
.t-ledger .t-table__content{overflow-x:auto}
.t-ledger table{font-size:var(--t14);line-height:var(--lh14)}
.t-ledger th,.t-ledger__th{
  background:var(--paper);color:var(--ink-2);font-size:var(--t12);line-height:var(--lh12);
  font-weight:600;white-space:nowrap;text-align:start;
}
.t-ledger td{padding-block:10px;border-bottom:1px solid var(--rule);vertical-align:middle}
.t-ledger th:first-child,.t-ledger td:first-child{padding-inline-start:var(--s4)}
.t-ledger tbody tr:hover td{background:var(--paper)}
.t-ledger tbody tr.is-closed td{color:var(--ink-2)}
.cell-ttl{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell-acts{display:flex;gap:10px;justify-content:flex-end;align-items:center}
.cell-acts .t-button{min-height:28px;padding-inline:var(--s1)}
.t-ledger .t-checkbox{min-height:28px;min-width:28px;display:inline-flex;align-items:center;justify-content:center}
.nowrap{white-space:nowrap}
.cell-num{font-variant-numeric:tabular-nums;white-space:nowrap}
.cell-time{white-space:nowrap;font-family:var(--font-mono);color:var(--ink-2);font-size:var(--t12);line-height:var(--lh12)}
.cell-id{white-space:nowrap;font-family:var(--font-mono);font-size:var(--t12);line-height:var(--lh12);color:var(--ink)}
.cell-bool{display:flex;align-items:center;justify-content:center}

/* 状态与优先级标签 */
.st{
  display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 var(--s2);
  border-radius:var(--r4);font-size:var(--t12);line-height:var(--lh12);white-space:nowrap;
}
.st--new{background:var(--warn-weak);color:var(--warn)}
.st--doing{background:var(--brand-weak);color:var(--brand)}
.st--resolved{background:var(--ok-weak);color:var(--ok)}
.st--closed{background:var(--paper);color:var(--ink-2)}
.st__dot{width:6px;height:6px;border-radius:50%;flex:0 0 auto}
.st--new .st__dot{background:var(--seg-new)}
.st--doing .st__dot{background:var(--seg-doing)}
.st--resolved .st__dot{background:var(--seg-done)}
.st--closed .st__dot{background:var(--seg-closed)}
.pri{
  display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 var(--s2);
  border:1px solid currentColor;border-radius:var(--r4);
  font-size:var(--t12);line-height:var(--lh12);white-space:nowrap;background:var(--surface);
}
.pri--p1{color:var(--danger)}
.pri--p2{color:var(--warn)}
.pri--p3{color:var(--ink-2)}
.pri__bars{display:inline-flex;align-items:flex-end;gap:2px;height:10px}
.pri__bars i{display:block;width:3px;background:currentColor;border-radius:1px}
.pri__bars i:nth-child(1){height:4px}
.pri__bars i:nth-child(2){height:7px}
.pri__bars i:nth-child(3){height:10px}
.pri--p3 .pri__bars i:nth-child(2),.pri--p3 .pri__bars i:nth-child(3){opacity:.28}
.pri--p2 .pri__bars i:nth-child(3){opacity:.28}

/* 空态 / 加载态 */
.empty{display:grid;gap:var(--s2);place-items:center;padding:var(--s7) var(--s4);text-align:center}
.empty__h{font-size:var(--t16);line-height:var(--lh16);font-weight:600}
.empty__p{font-size:var(--t12);line-height:var(--lh12);color:var(--ink-2);max-width:38ch}
.skel{padding:var(--s3) var(--s4) var(--s4)}
.skel__lead{font-size:var(--t12);line-height:var(--lh12);color:var(--ink-2);margin-bottom:var(--s3)}
.skel__row{display:grid;grid-template-columns:88px 1fr 64px;gap:var(--s3);align-items:center;height:44px;border-bottom:1px solid var(--rule)}
.skel__band{height:12px;border-radius:var(--r4);background:var(--rule-2);
  animation:shimmer 1.4s var(--ease-standard) infinite}
.skel__band--s{width:60%}
.skel__band--m{width:85%}
@keyframes shimmer{0%{opacity:.55}50%{opacity:1}100%{opacity:.55}}

/* 分页 */
.ledger__foot{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:center;padding:var(--s3) var(--s4);border-top:1px solid var(--rule)}
.ledger__foot .grow{flex:1 1 auto}
.ledger__count{font-size:var(--t12);line-height:var(--lh12);color:var(--ink-2);font-variant-numeric:tabular-nums}
.t-pagination__total{display:none}

/* 移动端卡片 */
.cards{display:grid;gap:0}
.card{padding:var(--s3) var(--s4);border-top:1px solid var(--rule);display:grid;gap:var(--s2)}
.card:first-child{border-top:0}
.card__top{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.card__id{font-size:var(--t12);line-height:var(--lh12);color:var(--ink-2)}
.card__t{font-size:var(--t14);line-height:var(--lh14);font-weight:600}
.card__meta{display:grid;grid-template-columns:1fr 1fr;gap:var(--s1) var(--s3);font-size:var(--t12);line-height:var(--lh12)}
.card__meta div{display:flex;gap:6px;min-width:0}
.card__meta dt{color:var(--ink-2);flex:0 0 auto}
.card__meta dd{color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card__foot{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s1) var(--s3);font-size:var(--t12);line-height:var(--lh12);color:var(--ink-2)}
.card__foot>span{white-space:nowrap}
.card__acts{margin-inline-start:auto;display:flex;gap:var(--s1);flex-wrap:wrap;justify-content:flex-end}
.card__meta div:first-child{grid-column:1 / -1}

@media (max-width:767px){
  .card__acts .t-button,.toolbar .t-button,.toolbar__tail .t-button{min-height:36px;padding-inline:var(--s2)}
  .card{row-gap:var(--s3)}
}
@media (max-width:399px){
  .toolbar{grid-template-columns:1fr}
  .toolbar__search,.toolbar__tail{grid-column:auto}
}

/* ── 页脚 Ft2 ───────────────────────────────────────────── */
.foot{border-top:1px solid var(--rule);padding-block:var(--s4) var(--s5)}
.foot p{font-family:var(--font-mono);font-size:var(--t12);line-height:var(--lh12);color:var(--ink-2);max-width:110ch}
.foot span{color:var(--rule-2);padding-inline:var(--s1)}

/* ── 抽屉 / 弹窗 / 面板 ──────────────────────────────────── */
.dt{display:grid;gap:var(--s4)}
.dt__h{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2)}
.dt__id{font-size:var(--t12);line-height:var(--lh12);color:var(--ink-2)}
.dt__title{font-size:var(--t20);line-height:var(--lh20);font-weight:600}
.dt__dl{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3) var(--s4);font-size:var(--t14);line-height:var(--lh14)}
.dt__dl dt{font-size:var(--t12);line-height:var(--lh12);color:var(--ink-2);margin-bottom:2px}
.dt__dl dd{font-weight:400}
.dt__sec{border-top:1px solid var(--rule);padding-top:var(--s3)}
.dt__sec h3{font-size:var(--t12);line-height:var(--lh12);color:var(--ink-2);font-weight:600;margin-bottom:var(--s2)}
.dt__p{font-size:var(--t14);line-height:var(--lh14);max-width:38ch}
.log{display:grid;gap:var(--s2)}
.log li{display:grid;grid-template-columns:88px 1fr;gap:var(--s3);font-size:var(--t12);line-height:var(--lh12)}
.log time{font-family:var(--font-mono);color:var(--ink-2)}
.dt__acts{display:flex;gap:var(--s2);flex-wrap:wrap}

.form{display:grid;gap:var(--s3)}
.form__req{color:var(--danger);margin-inline-start:2px}
.form__err{display:block;margin-top:var(--s1);font-size:var(--t12);line-height:var(--lh12);color:var(--danger)}

function fmtWait(min) {
  if (!min) return '—';
  if (min < 60) return min + ' 分钟';
  const h = Math.floor(min / 60), m = min % 60;
  if (h < 24) return m ? h + ' 小时 ' + m + ' 分' : h + ' 小时';
  const d = Math.floor(h / 24), rh = h % 24;
  return rh ? d + ' 天 ' + rh + ' 小时' : d + ' 天';
}
function shortTime(s) { return s.slice(5); }
function addMin(s, delta) {
  const d = new Date(s.replace(' ', 'T') + ':00');
  d.setMinutes(d.getMinutes() + delta);
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function nowStr() {
  const d = new Date(); const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function pctList(nums) {
  const total = nums.reduce((a, b) => a + b, 0);
  if (!total) return nums.map(() => 0);
  const raw = nums.map(n => (n / total) * 100);
  const base = raw.map(Math.floor);
  let rest = 100 - base.reduce((a, b) => a + b, 0);
  const order = raw.map((v, i) => ({ i, frac: v - Math.floor(v) })).sort((a, b) => b.frac - a.frac);
  for (let k = 0; k < order.length && rest > 0; k++) { base[order[k].i] += 1; rest -= 1; }
  return base;
}

function useViewportWidth() {
  const get = () => window.innerWidth;
  const [width, setWidth] = useState(get);
  useEffect(() => {
    const on = () => setWidth(get());
    window.addEventListener('resize', on);
    const ro = new ResizeObserver(on);
    ro.observe(document.documentElement);
    // 兜底：部分自动化环境改视口宽度不派发 resize / RO 回调，轮询一次成本可忽略
    const timer = window.setInterval(on, 300);
    return () => {
      window.removeEventListener('resize', on);
      ro.disconnect();
      window.clearInterval(timer);
    };
  }, []);
  return width;
}

        e(Select, {
          value: form.prio,
          options: [{ value: 1, label: '紧急' }, { value: 2, label: '较高' }, { value: 3, label: '普通' }],
          onChange: v => setForm({ ...form, prio: v })
        })),
      e('div', { className: 'field', 'data-field': 'desc' },
        e('label', { className: 'fieldlabel' }, '补充说明（可选）'),
        e(Input, { value: form.desc, placeholder: '影响范围、已尝试的处理', onChange: v => setForm({ ...form, desc: v }) }))));

  /* 主体 */
  const stats = STATUS_ORDER.map(s => e('button', {
    key: s, className: 'stat', type: 'button',
    'aria-pressed': statusF === s ? 'true' : 'false',
    onClick: () => setStatusF(statusF === s ? 'all' : s)
  },
    e('span', { className: 'stat__n' }, counts[s]),
    e('span', { className: 'stat__l' },
      e('i', { className: 'swatch swatch--' + s, 'aria-hidden': 'true' }), STATUS[s].label)));

  const shares = pctList(STATUS_ORDER.map(s => counts[s]));
  const distItems = STATUS_ORDER.map((s, i) => ({ s, n: counts[s], p: shares[i] }));
  const distLabel = '状态分布：' + distItems.map(d => STATUS[d.s].label + ' ' + d.n + ' 张 ' + d.p + '%').join('，');

  const distBar = e('div', { className: 'dist__bar', role: 'img', 'aria-label': distLabel },
    distItems.filter(d => d.n > 0).map(d => e('span', {
      key: d.s, className: 'dist__seg',
      style: { flex: d.n + ' 0 0', background: 'var(--seg-' + d.s + ')' }
    })));

  const distLegend = e('ul', { className: 'dist__legend' },
    distItems.map(d => e('li', { key: d.s, className: 'dist__item' },
      e('i', { className: 'swatch swatch--' + d.s, 'aria-hidden': 'true' }),
      e('span', {}, STATUS[d.s].label), e('b', {}, d.p + '%'))));

  const toolbar = e('div', { className: 'toolbar' },
    e('div', { className: 'toolbar__search' },
      e('label', { className: 'fieldlabel' }, '搜索'),
      e(Input, {
        value: q, clearable: true, placeholder: '单号、标题、设备、请求人',
        onChange: v => setQ(v), 'aria-label': '搜索工单'
      })),
    e('div', {},
      e('label', { className: 'fieldlabel' }, '状态'),
      e(Select, {
        value: statusF, onChange: v => setStatusF(v), 'aria-label': '按状态筛选',
        options: [{ value: 'all', label: '全部状态' }].concat(STATUS_ORDER.map(s => ({ value: s, label: STATUS[s].label })))
      })),
    e('div', {},
      e('label', { className: 'fieldlabel' }, '优先级'),
      e(Select, {
        value: prioF, onChange: v => setPrioF(v), 'aria-label': '按优先级筛选',
        options: [{ value: 'all', label: '全部优先级' }].concat([1, 2, 3].map(p => ({ value: String(p), label: PRIO[p] })))
      })),
    e('div', {},
      e('label', { className: 'fieldlabel' }, '排序'),
      e(Select, { value: sortKey, onChange: v => setSortKey(v), 'aria-label': '排序方式', options: SORTS })),
    e('div', {},
      e('label', { className: 'fieldlabel' }, '每页'),
      e(Select, {
        value: pageSize, onChange: v => setPageSize(v), 'aria-label': '每页条数',
        options: [12, 20, 40].map(n => ({ value: n, label: n + ' 张' }))
      })),
    e('div', { className: 'toolbar__tail' },
      e(Button, { variant: 'text', onClick: clearFilters, disabled: q === '' && statusF === 'all' && prioF === 'all' }, '重置'),
      e(Button, { variant: 'outline', onClick: exportCsv }, '导出 CSV')));

  const selbar = selected.length ? e('div', { className: 'selbar', role: 'status' },
    e('span', {}, '已选 ', e('b', {}, selected.length), ' 张'),
    e(Button, { size: 'small', theme: 'primary', onClick: claimBatch }, '批量认领'),
    e('span', { className: 'grow' }),
    e(Button, { size: 'small', variant: 'text', onClick: () => setSelected([]) }, '清除选择')) : null;

  const loading = booting ? e('div', { className: 'skel', 'data-state': 'loading', 'aria-busy': 'true' },
    e('p', { className: 'skel__lead' }, '正在读取工单队列…'),
    Array.from({ length: 7 }).map((_, i) => e('div', { key: i, className: 'skel__row' },
      e('span', { className: 'skel__band skel__band--s' }),
      e('span', { className: 'skel__band ' + (i % 2 ? 'skel__band--m' : '') }),
      e('span', { className: 'skel__band' })))) : null;

  const cards = e('ul', { className: 'cards', 'aria-label': '工单列表' },
    pageRows.map(row => e('li', { key: row.id, className: 'card', 'data-status': row.status },
      e('div', { className: 'card__top' },
        e(Checkbox, {
          checked: selected.includes(row.id), onChange: () => toggleRow(row.id),
          'aria-label': '选择 ' + row.id
        }),
        e('span', { className: 'card__id mono' }, row.id),
        e(StatusTag, { s: row.status }),
        e(PrioTag, { p: row.prio })),
      e('h3', { className: 'card__t' }, row.title),
      e('dl', { className: 'card__meta' },
        e('div', {}, e('dt', {}, '设备'), e('dd', {}, row.system)),
        e('div', {}, e('dt', {}, '部门'), e('dd', {}, row.dept)),
        e('div', {}, e('dt', {}, '请求人'), e('dd', {}, row.requester)),
        e('div', {}, e('dt', {}, '处理人'), e('dd', {}, row.assignee))),
      e('div', { className: 'card__foot' },
        e('span', {}, '等待 ' + fmtWait(row.wait)),
        e('span', { className: 'mono' }, shortTime(row.updated)),
        e('div', { className: 'card__acts' },
          e(Button, { size: 'small', variant: 'text', theme: 'primary', onClick: () => setDrawerId(row.id) }, '详情'),
          row.status === 'new' ? e(Button, { size: 'small', variant: 'text', onClick: () => claim(row) }, '认领') : null,
          row.status === 'doing' ? e(Button, { size: 'small', variant: 'text', onClick: () => solve(row) }, '解决') : null,
          row.status === 'resolved' ? e(Button, { size: 'small', variant: 'text', onClick: () => undo(row) }, '撤销') : null)))));

  const nav = e('header', { className: 'nav' },
    e('div', { className: 'wrap nav__in' },
      e('a', { className: 'brand', href: '#top' },
        e('span', { className: 'brand__mark' }, 'FixQueue'),
        e('span', { className: 'brand__q' }, '一线台账')),
      e('div', { className: 'duty' },
        e('i', { className: 'duty__dot', 'aria-hidden': 'true' }),
        e('span', {}, '值班主管 ', e('b', {}, '陈亦然')),
        e('span', { className: 'duty__sep', 'aria-hidden': 'true' }, '/'),
        e('span', {}, '08:00–20:00'),
        e('span', { className: 'duty__sep', 'aria-hidden': 'true' }, '/'),
        e('span', {}, '一线 3 人 · 在线 2')),
      e('span', { className: 'nav__spacer' }),
      e('button', { className: 'searchpill', type: 'button', ref: pillRef, onClick: openPalette, 'aria-label': '搜索，快捷键 Command K' },
        e('svg', { width: 14, height: 14, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2, 'aria-hidden': 'true' },
          e('circle', { cx: 11, cy: 11, r: 7 }), e('path', { d: 'M20 20l-3.5-3.5' })),
        e('span', { className: 'searchpill__txt' }, '跳转工单或执行动作'),
        e('span', { className: 'kbd' }, '⌘K')),
      e('button', { className: 'iconbtn', type: 'button', onClick: openPalette, 'aria-label': '搜索，快捷键 Command K' },
        e('svg', { width: 16, height: 16, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2, 'aria-hidden': 'true' },
          e('circle', { cx: 11, cy: 11, r: 7 }), e('path', { d: 'M20 20l-3.5-3.5' }))),
      e(Button, { className: 'nav__new', theme: 'primary', onClick: openCreate }, '新建工单')));

  const hero = e('section', { className: 'hero', 'aria-labelledby': 'hero-h' },
    e('h1', { className: 'hero__h', id: 'hero-h' },
      e('span', { className: 'hero__figure' }, unassigned),
      e('span', { className: 'hero__words' }, '张无人认领，最长一条等了 ',
        e('span', { className: 'nowrap' }, fmtWait(unassignedMax)))),
    e('p', { className: 'hero__note' },
      '队列共 ' + tickets.length + ' 张，待处理 ' + counts.new + ' 张（' + unassigned + ' 张未认领），处理中 ' + counts.doing +
      ' 张。演示数据，刷新回初始。'),
    e('div', { className: 'stats', role: 'group', 'aria-label': '按状态筛选' }, stats),
    e('div', { className: 'dist' }, distBar, distLegend));

  const ledger = e('section', { className: 'ledger', id: 'ledger', 'aria-labelledby': 'ledger-h' },
    e('div', { className: 'ledger__head' },
      e('h2', { className: 'ledger__t', id: 'ledger-h' }, '工单队列'),
      e('span', { className: 'ledger__n' }, '共 ' + rows.length + ' 张 · 第 ' + safePage + ' / ' + pages + ' 页'),
      e('span', { className: 'ledger__hint' }, narrow ? '点开卡片右上角按钮处理' : '点任意行打开详情')),
    toolbar,
    selbar,
    scrollHint ? e('p', { className: 'tblnote' }, '表格最窄 1080px：窗口更窄时左右滚动查看，单号列固定在左侧。') : null,
    loading || (narrow ? (pageRows.length ? cards : emptyNode) : e(Table, {
      className: 't-ledger', columns, data: pageRows, rowKey: 'id',
      hover: true, size: 'small', tableLayout: 'fixed', disableDataPage: true,
      empty: emptyNode,
      rowClassName: params => params.row.status === 'closed' ? 'is-closed' : '',
      onRowClick: params => setDrawerId(params.row.id)
    })),
    e('div', { className: 'ledger__foot' },
      e('span', { className: 'ledger__count' },
        rows.length
          ? '显示 ' + ((safePage - 1) * pageSize + 1) + ' - ' + Math.min(safePage * pageSize, rows.length) + ' 张，共 ' + rows.length + ' 张'
          : '没有可显示的工单'),
      e('span', { className: 'grow' }),
      e(Pagination, {
        total: rows.length, current: safePage, pageSize, showJumper: !narrow,
        pageSizeOptions: [12, 20, 40],
        onChange: info => {
          setPage(info.current);
          if (info.pageSize !== pageSize) { setPageSize(info.pageSize); setPage(1); }
        }
      })));

  const foot = e('footer', { className: 'foot' },
    e('div', { className: 'wrap' },
      e('p', {},
        'FixQueue · 演示数据，不连后端，刷新即回初始',
        e('span', {}, '·'), 'tdesign-react 1.18.6 / React 18.3.1',
        e('span', {}, '·'), '基准规范 TDesign · Stat-Led / N13 / Ft2',
        e('span', {}, '·'), '2026-11-14')));

  return e(React.Fragment, null,
    e('a', { className: 'skip', href: '#ledger' }, '跳到工单台账'),
    nav,
    e('main', { id: 'top' }, e('div', { className: 'wrap' }, hero, ledger)),
    foot,
    e('p', { className: 'sr-only', role: 'status', 'aria-live': 'polite' }, announce),
    drawer, dialog, palette);
}

createRoot(document.getElementById('app')).render(e(App));
</script>
</body>
</html>
