<style>
/* Hallmark · macrostructure: Ecosystem Index · nav: N13 Inline ⌘K pill · footer: Ft4 Dense typographic
 * tone: 实用、克制、以信息密度取胜 · anchor hue: #0052d9（TDesign 腾讯蓝）
 * theme: TDesign 官方色板（白纸 + 中性灰 + 单一品牌蓝）
 * pre-emit critique: P5 H4 E5 S5 R5 V5
 */
:root {
  --td-brand-color: #0052d9;
  --td-brand-color-hover: #366ef4;
  --paper: #ffffff;
  --paper-2: #f3f3f3;
  --paper-3: #e8e8e8;
  --rule: #e8e8e8;
  --rule-strong: #8b8b8b;
  --ink: #181818;
  --ink-2: #5e5e5e;
  --ink-3: #5e5e5e;
  --ok: #006c45;
  --ok-bg: #e3f9e9;
  --warn: #954500;
  --warn-bg: #fff1e9;
  --danger: #ad352f;
  --danger-bg: #fff0ed;
  --brand-soft: #f2f3ff;
  --brand-deep: #003cab;
  --focus: #0052d9;

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;

  --text-xs: 12px;
  --text-s: 14px;
  --text-m: 16px;
  --text-l: 20px;
  --text-xl: 24px;

  --lh-xs: 20px;
  --lh-s: 22px;
  --lh-m: 24px;
  --lh-l: 28px;
  --lh-xl: 32px;

  --radius-s: 4px;
  --radius-m: 8px;
  --dur-fast: 200ms;
  --dur-mid: 240ms;
  --dur-slow: 280ms;
  --ease-standard: cubic-bezier(.38, 0, .24, 1);
  --ease-out: cubic-bezier(0, 0, .15, 1);
  --ease-in: cubic-bezier(.82, 0, 1, .9);
  --wrap: 1200px;

  --td-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans GB",
    "Microsoft YaHei UI", "Microsoft YaHei", "Source Han Sans CN", sans-serif;
  --td-text-color-primary: rgba(0, 0, 0, .9);
  --td-text-color-secondary: rgba(0, 0, 0, .6);
  --td-text-color-placeholder: #5e5e5e;
  --td-brand-color-focus: #0052d9;
  --td-radius-default: 4px;
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  overflow-x: clip;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--td-font-family);
  font-size: var(--text-s);
  line-height: var(--lh-s);
  -webkit-font-smoothing: antialiased;
}

body { font-weight: 400; }

h1, h2, h3, p, ul, ol, dl, dd, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }

h1 { font-size: var(--text-xl); line-height: var(--lh-xl); font-weight: 600; letter-spacing: -.2px; }
h2 { font-size: var(--text-l); line-height: var(--lh-l); font-weight: 600; }
h3 { font-size: var(--text-s); line-height: var(--lh-s); font-weight: 600; }

a { color: var(--td-brand-color); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 2px; }

:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 2px; }
:focus:not(:focus-visible) { outline: none; }

.wrap { max-width: var(--wrap); margin-inline: auto; padding-inline: var(--space-5); }
.mono-num { font-variant-numeric: tabular-nums; }

.skip {
  position: absolute; left: var(--space-4); top: -48px; z-index: 60;
  background: var(--td-brand-color); color: #ffffff; padding: var(--space-2) var(--space-4);
  border-radius: var(--radius-s); transition: top var(--dur-fast) var(--ease-out);
}
.skip:focus { top: var(--space-2); }

/* ---------- N13 搜索胶囊页头 ---------- */
.nav {
  position: sticky; top: 0; z-index: 30;
  background: var(--paper);
  border-bottom: 1px solid var(--rule);
}
.nav__inner {
  display: flex; align-items: center; gap: var(--space-4);
  max-width: var(--wrap); margin-inline: auto;
  padding: var(--space-3) var(--space-5);
  min-height: 64px;
}
.brand {
  font-size: var(--text-m); line-height: var(--lh-m); font-weight: 600;
  color: var(--ink); letter-spacing: .2px; white-space: nowrap;
}
.brand:hover { text-decoration: none; color: var(--td-brand-color); }
.brand span { color: var(--ink-2); font-weight: 400; margin-left: var(--space-2); font-size: var(--text-xs); }

.pill {
  display: flex; align-items: center; gap: var(--space-2);
  flex: 1 1 320px; min-width: 0; max-width: 420px;
  height: 40px; padding-inline: var(--space-3);
  background: var(--paper); color: var(--ink-2);
  border: 1px solid var(--rule-strong); border-radius: 999px;
  font: inherit; text-align: left; cursor: pointer;
  transition: border-color var(--dur-fast) var(--ease-standard), background var(--dur-fast) var(--ease-standard);
}
.pill:hover { border-color: var(--td-brand-color); background: var(--brand-soft); }
.pill__ico { flex: none; width: 16px; height: 16px; }
.pill__text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill__kbd { display: flex; gap: 2px; flex: none; }
kbd {
  font-family: inherit; font-size: var(--text-xs); line-height: 16px;
  padding: 1px 5px; border: 1px solid var(--rule-strong); border-radius: var(--radius-s);
  color: var(--ink-2); background: var(--paper-2);
}

.nav__links { display: flex; align-items: center; gap: var(--space-4); margin-left: auto; }
.nav__links a { display: inline-flex; align-items: center; min-height: 24px; color: var(--ink); white-space: nowrap; }
.nav__links a:hover { color: var(--td-brand-color); }

.cartlink {
  display: inline-flex; align-items: center; gap: var(--space-2);
  min-height: 40px; padding-inline: var(--space-3);
  background: var(--paper-2); color: var(--ink);
  border: 1px solid var(--rule-strong); border-radius: var(--radius-s);
  font: inherit; cursor: pointer; white-space: nowrap;
  transition: background var(--dur-fast) var(--ease-standard);
}
.cartlink:hover { background: var(--paper-3); }
.cartlink__n {
  min-width: 20px; height: 20px; padding-inline: 5px;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--td-brand-color); color: #ffffff;
  border-radius: 10px; font-size: var(--text-xs); font-variant-numeric: tabular-nums;
}

/* ---------- 定位段（Ecosystem Index：无大标题） ---------- */
.intro { padding-block: var(--space-7) var(--space-6); border-bottom: 1px solid var(--rule); }
.intro__kicker {
  font-size: var(--text-xs); line-height: var(--lh-xs); color: var(--ink-2);
  letter-spacing: .4px; margin-bottom: var(--space-3);
}
.intro__h { max-width: 34ch; margin-bottom: var(--space-4); }
.intro__p { max-width: 68ch; color: var(--ink-2); margin-bottom: var(--space-3); }
.intro__demo {
  display: inline-block; max-width: 68ch;
  padding: var(--space-2) var(--space-3);
  background: var(--warn-bg); color: var(--warn);
  border-radius: var(--radius-s); font-size: var(--text-xs); line-height: var(--lh-xs);
}

/* ---------- 发现面 ---------- */
.rail { padding-block: var(--space-6); border-bottom: 1px solid var(--rule); }
.rail__head {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: var(--space-4); margin-bottom: var(--space-4);
}
.rail__k { font-size: var(--text-xs); line-height: var(--lh-xs); color: var(--ink-2); margin-bottom: var(--space-1); }
.rail__more { display: inline-flex; align-items: center; min-height: 24px; font-size: var(--text-s); white-space: nowrap; }

.picks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4); }
.pick {
  display: flex; flex-direction: column; gap: var(--space-2);
  padding: var(--space-4); border: 1px solid var(--rule); border-radius: var(--radius-m);
  background: var(--paper); min-width: 0;
  transition: border-color var(--dur-fast) var(--ease-standard);
}
.pick:hover { border-color: var(--rule-strong); }
.pick__top { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); }
.pick__name { font-weight: 600; overflow-wrap: anywhere; }
.pick__meta { font-size: var(--text-xs); line-height: var(--lh-xs); color: var(--ink-2); }
.pick__price { font-size: var(--text-l); line-height: var(--lh-l); font-weight: 600; font-variant-numeric: tabular-nums; }

.swatch { display: flex; gap: var(--space-1); height: 6px; border-radius: 3px; overflow: hidden; }
.swatch i { flex: 1; display: block; }

.rooms { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4); }
.room {
  display: flex; flex-direction: column; gap: var(--space-1);
  padding: var(--space-4); border: 1px solid var(--rule); border-radius: var(--radius-m);
  background: var(--paper); color: var(--ink); text-align: left; font: inherit; cursor: pointer;
  min-width: 0;
  transition: border-color var(--dur-fast) var(--ease-standard), background var(--dur-fast) var(--ease-standard);
}
.room:hover { border-color: var(--rule-strong); background: var(--paper-2); }
.room__name { font-weight: 600; }
.room__note { font-size: var(--text-xs); line-height: var(--lh-xs); color: var(--ink-2); }
.room__foot { font-size: var(--text-xs); line-height: var(--lh-xs); color: var(--ink-2); margin-top: var(--space-1); }

.bands { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.band {
  min-height: 36px; padding-inline: var(--space-3);
  display: inline-flex; align-items: center; gap: var(--space-2);
  border: 1px solid var(--rule-strong); border-radius: 999px;
  background: var(--paper); color: var(--ink); font: inherit; cursor: pointer;
  transition: background var(--dur-fast) var(--ease-standard), border-color var(--dur-fast) var(--ease-standard);
}
.band:hover { background: var(--paper-2); }
.band[aria-pressed="true"] { background: var(--td-brand-color); border-color: var(--td-brand-color); color: #ffffff; }
.band__n { font-size: var(--text-xs); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.band[aria-pressed="true"] .band__n { color: #ffffff; }

/* ---------- 目录：筛选条 ---------- */
.catalogue { padding-block: var(--space-6) var(--space-7); }
.toolbar {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-3);
  align-items: center; padding: var(--space-4);
  border: 1px solid var(--rule); border-radius: var(--radius-m); background: var(--paper-2);
  margin-bottom: var(--space-4);
}
.toolbar__search { min-width: 0; }
.toolbar__right { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
.toolbar__sort { width: 200px; }
.chips { display: flex; flex-wrap: wrap; gap: var(--space-2); grid-column: 1 / -1; }
.chip {
  min-height: 32px; padding-inline: var(--space-3);
  border: 1px solid var(--rule-strong); border-radius: 999px;
  background: var(--paper); color: var(--ink); font: inherit; cursor: pointer;
  transition: background var(--dur-fast) var(--ease-standard), border-color var(--dur-fast) var(--ease-standard);
}
.chip:hover { background: var(--paper-3); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #ffffff; }

.countbar {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: var(--space-3); flex-wrap: wrap; margin-bottom: var(--space-3);
}
.countbar__n { font-weight: 600; font-variant-numeric: tabular-nums; }
.countbar__hint { font-size: var(--text-xs); line-height: var(--lh-xs); color: var(--ink-2); }
.linkish {
  display: inline-flex; align-items: center; min-height: 24px;
  background: none; border: 0; padding: 0; font: inherit; color: var(--td-brand-color);
  cursor: pointer; text-decoration: underline; text-underline-offset: 2px; white-space: nowrap;
}

/* ---------- 商品网格 ---------- */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4); }
.card {
  display: flex; flex-direction: column; gap: var(--space-2);
  padding: var(--space-4); border: 1px solid var(--rule); border-radius: var(--radius-m);
  min-width: 0; background: var(--paper);
  transition: border-color var(--dur-fast) var(--ease-standard);
}
.card:hover { border-color: var(--rule-strong); }
.card__room { font-size: var(--text-xs); line-height: var(--lh-xs); color: var(--ink-2); }
.card__name { font-size: var(--text-s); line-height: var(--lh-s); font-weight: 600; overflow-wrap: anywhere; }
.card__mat { font-size: var(--text-xs); line-height: var(--lh-xs); color: var(--ink-2); overflow-wrap: anywhere; }
.card__facts { font-size: var(--text-xs); line-height: var(--lh-xs); color: var(--ink-2); }
.card__price { font-size: var(--text-l); line-height: var(--lh-l); font-weight: 600; font-variant-numeric: tabular-nums; margin-top: auto; }
.card__stock { font-size: var(--text-xs); line-height: var(--lh-xs); font-weight: 600; }
.card__act { display: grid; grid-template-columns: 1fr; gap: var(--space-2); }

.stock-in { color: var(--ok); }
.stock-low { color: var(--warn); }
.stock-out { color: var(--ink-3); }

.tag { display: inline-flex; align-items: center; height: 22px; padding-inline: var(--space-2);
  border-radius: var(--radius-s); font-size: var(--text-xs); line-height: var(--lh-xs); white-space: nowrap; }
.tag--in { background: var(--ok-bg); color: var(--ok); }
.tag--low { background: var(--warn-bg); color: var(--warn); }
.tag--out { background: var(--paper-2); color: var(--ink-3); }
.tag--brand { background: var(--brand-soft); color: var(--brand-deep); }

/* ---------- 骨格占位 ---------- */
.sk { background: var(--paper-2); border-radius: var(--radius-s); }
.sk--line { height: 12px; }
.sk--title { height: 16px; width: 72%; }
.sk--price { height: 20px; width: 38%; }
.sk--btn { height: 32px; }
.sk-card { display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-4);
  border: 1px solid var(--rule); border-radius: var(--radius-m); min-width: 0; }
.sk-card .sk { animation: sk-breathe var(--dur-slow) var(--ease-standard) infinite alternate; }
@keyframes sk-breathe { from { opacity: 1; } to { opacity: .55; } }

.empty {
  display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-3);
  padding: var(--space-6); border: 1px dashed var(--rule-strong); border-radius: var(--radius-m);
  background: var(--paper);
}
.empty__h { font-weight: 600; }
.empty__p { color: var(--ink-2); max-width: 52ch; }

/* ---------- 详情 ---------- */
.detail { padding-block: var(--space-7); border-top: 1px solid var(--rule); }
.secthead { display: flex; flex-direction: column; gap: var(--space-1); margin-bottom: var(--space-5); }
.secthead__k { font-size: var(--text-xs); line-height: var(--lh-xs); color: var(--ink-2); letter-spacing: .4px; }
.secthead h2:focus-visible { outline-offset: 4px; }
#catalogue:focus-visible { outline: 2px solid var(--focus); outline-offset: 6px; }
h1, h2, h3, [id] { scroll-margin-top: 88px; }
.detail__grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-5); }

.facts { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: var(--space-2) var(--space-3); margin-block: var(--space-3) var(--space-4); }
.facts dt { font-size: var(--text-xs); line-height: var(--lh-xs); color: var(--ink-2); }
.facts dd { font-size: var(--text-s); overflow-wrap: anywhere; }

.price { display: flex; align-items: baseline; gap: var(--space-2); margin-bottom: var(--space-1); }
.price__n { font-size: var(--text-xl); line-height: var(--lh-xl); font-weight: 600; font-variant-numeric: tabular-nums; }
.price__u { font-size: var(--text-xs); color: var(--ink-2); }
.stockline { font-size: var(--text-s); font-weight: 600; margin-bottom: var(--space-4); }

.spec { border-top: 1px solid var(--rule); padding-top: var(--space-4); margin-top: var(--space-4); }
.spec__label { font-size: var(--text-xs); line-height: var(--lh-xs); color: var(--ink-2); margin-bottom: var(--space-2); }
.spec__opts { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.opt {
  min-height: 36px; padding-inline: var(--space-3);
  border: 1px solid var(--rule-strong); border-radius: var(--radius-s);
  background: var(--paper); color: var(--ink); font: inherit; cursor: pointer;
  transition: border-color var(--dur-fast) var(--ease-standard), background var(--dur-fast) var(--ease-standard);
}
.opt:hover:not(:disabled) { border-color: var(--td-brand-color); }
.opt[aria-pressed="true"] { border-color: var(--td-brand-color); box-shadow: inset 0 0 0 1px var(--td-brand-color); color: var(--td-brand-color); font-weight: 600; }
.opt:disabled { background: var(--paper-2); color: var(--ink-3); border-color: var(--rule); cursor: not-allowed; text-decoration: line-through; }

.qty { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; margin-block: var(--space-4); }
.qty__label { font-size: var(--text-s); }
.qty__hint { font-size: var(--text-xs); line-height: var(--lh-xs); color: var(--ink-2); }
.detail__act { display: flex; flex-wrap: wrap; gap: var(--space-3); }

.panel { border: 1px solid var(--rule); border-radius: var(--radius-m); padding: var(--space-4); margin-bottom: var(--space-4); }
.panel h3 { margin-bottom: var(--space-3); }
.panel__note { font-size: var(--text-xs); line-height: var(--lh-xs); color: var(--ink-2); margin-top: var(--space-3); }
.rules { display: grid; gap: var(--space-2); }
.rules li { padding-left: var(--space-4); position: relative; }
.rules li::before { content: "·"; position: absolute; left: var(--space-1); color: var(--ink-2); }

.revs { display: grid; gap: var(--space-3); }
.rev { display: grid; gap: var(--space-1); padding-top: var(--space-3); border-top: 1px solid var(--rule); }
.rev:first-child { border-top: 0; padding-top: 0; }
.rev__meta { font-size: var(--text-xs); line-height: var(--lh-xs); color: var(--ink-2); }
.rev__text { overflow-wrap: anywhere; }

.combos { width: 100%; border-collapse: collapse; font-size: var(--text-xs); line-height: var(--lh-xs); }
.combos th, .combos td { text-align: left; padding: var(--space-2); border-bottom: 1px solid var(--rule); }
.combos th { color: var(--ink-2); font-weight: 600; background: var(--paper-2); }
.combos td:last-child, .combos th:last-child { text-align: right; font-variant-numeric: tabular-nums; }

/* ---------- 购物车 ---------- */
.cart { padding-block: var(--space-7); border-top: 1px solid var(--rule); }
.lines { display: grid; gap: var(--space-3); margin-block: var(--space-4); }
.line {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-3) var(--space-4);
  align-items: center; padding: var(--space-3) var(--space-4);
  border: 1px solid var(--rule); border-radius: var(--radius-m);
}
.line__name { font-weight: 600; overflow-wrap: anywhere; }
.line__spec { font-size: var(--text-xs); line-height: var(--lh-xs); color: var(--ink-2); }
.line__price, .line__sub { font-variant-numeric: tabular-nums; }
.line__sub { font-weight: 600; }
.line__sub::before { content: "小计 "; font-weight: 400; font-size: var(--text-xs); color: var(--ink-2); }
.line__rm {
  justify-self: start; min-height: 32px; padding-inline: var(--space-3);
  background: var(--paper); color: var(--danger); border: 1px solid var(--rule-strong);
  border-radius: var(--radius-s); font: inherit; cursor: pointer;
  transition: background var(--dur-fast) var(--ease-standard);
}
.line__rm:hover { background: var(--danger-bg); }

.ship { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; padding: var(--space-4);
  border: 1px solid var(--rule); border-radius: var(--radius-m); background: var(--paper-2); }
.ship__label { font-size: var(--text-xs); color: var(--ink-2); }
.radio { display: inline-flex; align-items: center; gap: var(--space-2); min-height: 36px; cursor: pointer; }
.radio input {
  appearance: none; -webkit-appearance: none; margin: 0;
  width: 20px; height: 20px; flex: none;
  border: 1.5px solid var(--rule-strong); border-radius: 50%; background: var(--paper);
  transition: border-color var(--dur-fast) var(--ease-standard);
}
.radio input:checked { border-color: var(--td-brand-color); box-shadow: inset 0 0 0 3.5px var(--paper), inset 0 0 0 12px var(--td-brand-color); }
.radio input:disabled { background: var(--paper-2); border-color: var(--rule); }

.cmdk { position: fixed; inset: 0; z-index: 50; display: flex; justify-content: center; align-items: flex-start; }

const PRODUCTS = DATA.products.map((p) => {
  const room = DATA.rooms.find((r) => r.id === p.room);
  return Object.assign({}, p, { roomName: room ? room.name : p.room });
});

const PALETTE = {
  wood: "#c8a97e", white: "#f3efe6", dark: "#2c2c2c", linen: "#d9cfc0",
  green: "#3f5f4a", clay: "#b06a4a", grey: "#8b8b8b", blue: "#2f4b6b",
  steel: "#9aa2a8", glass: "#dce6ea", rattan: "#c9a86a", cream: "#f0e6d2",
};

const SWATCH_RULES = {
  "CL-01": ["wood", "white"], "CL-02": ["rattan", "wood"], "CL-03": ["linen", "blue", "clay"],
  "CL-04": ["dark", "cream"], "CL-05": ["wood", "dark"],
  "BD-01": ["cream", "blue"], "BD-02": ["wood", "cream"], "BD-03": ["cream", "grey"],
  "BD-04": ["grey", "cream"], "BD-05": ["wood", "wood"],
  "KT-01": ["cream", "green"], "KT-02": ["wood", "wood"], "KT-03": ["glass", "glass"],
  "KT-04": ["steel", "steel"], "KT-05": ["blue", "clay", "cream"], "KT-06": ["rattan", "rattan"],
  "BA-01": ["cream", "grey"], "BA-02": ["glass", "linen"], "BA-03": ["white", "grey"],
  "BA-04": ["wood", "wood"], "BA-05": ["linen", "grey"],
  "ST-01": ["dark", "dark"], "ST-02": ["grey", "clay"], "ST-03": ["dark", "cream"],
  "ST-04": ["glass", "glass"], "ST-05": ["wood", "cream"],
};

const BANDS = [
  { id: "lt100", label: "¥99 以下", lo: 0, hi: 99 },
  { id: "mid", label: "¥100 到 ¥299", lo: 100, hi: 299 },
  { id: "high", label: "¥300 以上", lo: 300, hi: Infinity },
];

const SORTS = [
  { label: "推荐排序：有货优先", value: "recommend" },
  { label: "价格从低到高", value: "price-asc" },
  { label: "价格从高到低", value: "price-desc" },
  { label: "评价数从多到少", value: "review" },
  { label: "规格数从多到少", value: "spec" },
];

const CITIES = ["北京", "上海", "广州", "深圳", "杭州", "成都", "乌鲁木齐", "拉萨"].map((c) => ({ label: c, value: c }));

const SHIP_MODES = [
  { id: "std", label: "标准配送", rule: "满 ¥199 免运费，未满 ¥12，2 到 4 个工作日" },
  { id: "exp", label: "加急配送", rule: "每单 ¥18，1 到 2 个工作日" },
  { id: "pickup", label: "到店自提", rule: "¥0，下单后 48 小时内取货" },
];

const STATE_TEXT = {
  soldout: "已售罄",
  low: "仅剩个位数",
  partial: "部分规格售罄",
  in: "现货",
};

function shipFeeOf(mode, subtotal) {
  if (subtotal === 0) return 0;
  if (mode === "exp") return 18;
  if (mode === "pickup") return 0;
  return subtotal >= 199 ? 0 : 12;
}

const App = {
  components: {
    TButton: TD.Button,
    TInput: TD.Input,
    TInputNumber: TD.InputNumber,
    TSelect: TD.Select,
  },
  setup() {
    const rooms = DATA.rooms;
    const total = PRODUCTS.length;

    const query = ref("");
    const room = ref("all");
    const band = ref("all");
    const sort = ref("recommend");
    const inStockOnly = ref(false);
    const loading = ref(true);

    const selectedId = ref(PRODUCTS[0].id);
    const chosen = reactive({});
    const qty = ref(1);

    const cart = ref([]);
    const shipMode = ref("std");

    const form = reactive({ name: "", phone: "", city: "", addr: "", note: "", agree: false });
    const errors = reactive({ name: "", phone: "", city: "", addr: "", agree: "" });
    const order = ref(null);

    const paletteOpen = ref(false);
    const paletteQuery = ref("");
    const paletteIndex = ref(0);
    const paletteInput = ref(null);
    const paletteTrigger = ref(null);

    const toast = ref("");
    let toastTimer = null;
    let loadTimer = null;

    function say(msg) {
      toast.value = msg;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => (toast.value = ""), 2600);
    }

    const roomName = (id) => {
      const r = rooms.find((x) => x.id === id);
      return r ? r.name : id;
    };

    const roomCount = (id) => PRODUCTS.filter((p) => p.room === id).length;
    const roomFrom = (id) => Math.min.apply(null, PRODUCTS.filter((p) => p.room === id).map((p) => p.priceFrom));

    const bands = BANDS;
    const sortOptions = SORTS;
    const cities = CITIES;
    const shipModes = SHIP_MODES;

    function bandMatch(p, id) {
      if (id === "all") return true;
      const b = BANDS.find((x) => x.id === id);
      return p.priceFrom >= b.lo && p.priceFrom <= b.hi;
    }
    const bandCount = (id) => PRODUCTS.filter((p) => bandMatch(p, id)).length;

    const filtered = computed(() => {
      const q = query.value.trim().toLowerCase();
      return PRODUCTS.filter((p) => {
        if (room.value !== "all" && p.room !== room.value) return false;
        if (!bandMatch(p, band.value)) return false;
        if (inStockOnly.value && p.state === "soldout") return false;
        if (q) {
          const hay = (p.name + " " + p.material + " " + p.blurb + " " + p.roomName + " " + p.id).toLowerCase();
          if (hay.indexOf(q) === -1) return false;
        }
        return true;
      });
    });

    const visible = computed(() => {
      const arr = filtered.value.slice();
      if (sort.value === "price-asc") arr.sort((a, b) => a.priceFrom - b.priceFrom);
      else if (sort.value === "price-desc") arr.sort((a, b) => b.priceFrom - a.priceFrom);
      else if (sort.value === "review") arr.sort((a, b) => b.reviewCount - a.reviewCount);
      else if (sort.value === "spec") arr.sort((a, b) => b.specCount - a.specCount);
      else arr.sort((a, b) => (a.state === "soldout" ? 1 : 0) - (b.state === "soldout" ? 1 : 0) || b.reviewCount - a.reviewCount);
      return arr;
    });

    const resultCount = computed(() => filtered.value.length);

    const filtersOn = computed(
      () => query.value.trim() !== "" || room.value !== "all" || band.value !== "all" || inStockOnly.value
    );
    const filterChips = computed(() => {
      const out = [];
      if (room.value !== "all") out.push("房间 " + roomName(room.value));
      if (band.value !== "all") out.push("价位 " + BANDS.find((b) => b.id === band.value).label);
      if (query.value.trim()) out.push("关键词「" + query.value.trim() + "」");
      if (inStockOnly.value) out.push("只看有货");
      return out.join(" · ");
    });

    const picks = computed(() =>
      PRODUCTS.slice()
        .filter((p) => p.state !== "soldout")
        .sort((a, b) => b.reviewCount - a.reviewCount)
        .slice(0, 4)
    );

    const current = computed(() => PRODUCTS.find((p) => p.id === selectedId.value) || PRODUCTS[0]);

    function syncChosen(p) {
      p.specs.forEach((dim) => {
        if (!dim.values.some((v) => v === chosen[dim.name])) chosen[dim.name] = dim.values[0];
        const live = dim.values.filter((v) => optionLive(dim.name, v));
        if (live.length && !live.some((v) => v === chosen[dim.name])) chosen[dim.name] = live[0];
      });
    }

    const combo = computed(() => {
      const p = current.value;
      const vals = p.specs.map((d) => chosen[d.name]);
      const found = p.combos.find((c) => c.v.every((v, i) => v === vals[i]));
      return found || p.combos[0];
    });

    const chosenText = computed(() => current.value.specs.map((d) => chosen[d.name]).filter(Boolean).join(" / "));

    const stockState = computed(() => {
      if (combo.value.stock === 0) return "out";
      if (combo.value.stock <= 5) return "low";
      return "in";
    });

    const comboText = computed(() => {
      if (combo.value.stock === 0) return "这个规格已售罄，换一个规格看看";
      if (combo.value.stock <= 5) return "仅剩 " + combo.value.stock + " 件";
      return "现货 " + combo.value.stock + " 件";
    });

    function optionLive(dimName, value) {
      const p = current.value;
      return p.combos.some((c) => {
        const idx = p.specs.findIndex((d) => d.name === dimName);
        return c.v[idx] === value && c.stock > 0;
      });
    }

    function choose(dimName, value) {
      if (!optionLive(dimName, value)) return;
      chosen[dimName] = value;
      qty.value = 1;
      nextTick(() => {
        if (combo.value.stock === 0) say("这个规格已售罄");
      });
    }

    watch(current, (p) => {
      Object.keys(chosen).forEach((k) => delete chosen[k]);
      syncChosen(p);
    }, { immediate: true });
    watch(
      () => combo.value.stock,
      (s) => {
        if (qty.value > Math.max(1, s)) qty.value = Math.max(1, s);
      }
    );

    const stockText = (p) => {
      if (p.state === "soldout") return "已售罄";
      if (p.state === "low") return "仅剩个位数";
      if (p.state === "partial") return "部分规格售罄";
      return "现货";
    };

    const swatchLabel = (p) => "可选配色：" + p.specs.map((d) => d.name + " " + d.values.join("、")).join("；");

    const swatches = (p) => {
      const names = SWATCH_RULES[p.id] || ["wood"];
      return names.map((n) => PALETTE[n] || PALETTE.wood);
    };

    function reload() {
      loading.value = true;
      clearTimeout(loadTimer);
      loadTimer = setTimeout(() => (loading.value = false), 280);
    }

    watch([query, room, band, inStockOnly], () => reload());

    function pickRoom(id) {
      room.value = id;
      document.getElementById("catalogue").scrollIntoView({ block: "start", behavior: "smooth" });
    }
    function setBand(id) {
      band.value = id;
      document.getElementById("catalogue").scrollIntoView({ block: "start", behavior: "smooth" });
    }
    function resetFilters() {
      query.value = "";
      room.value = "all";
      band.value = "all";
      inStockOnly.value = false;
      say("筛选已清空");
    }

    function focusEl(id) {
      nextTick(() => {
        const el = document.getElementById(id);
        if (!el) return;
        const inner = el.matches("input, select, textarea, button") ? el : el.querySelector("input, select, textarea, button");
        const target = inner || el;
        if (target === el && !el.hasAttribute("tabindex")) el.setAttribute("tabindex", "-1");
        target.focus({ preventScroll: true });
        el.scrollIntoView({ block: "start", behavior: "smooth" });
      });
    }

    function openDetail(p) {
      selectedId.value = p.id;
      qty.value = 1;
      focusEl("detail-h");
    }

    // ---------- 购物车 ----------
    const cartLines = computed(() =>
      cart.value.map((item) => {
        const p = PRODUCTS.find((x) => x.id === item.pid);
        const c = p.combos.find((x) => x.v.join("/") === item.key);
        return {
          key: item.pid + "|" + item.key,
          pid: p.id,
          name: p.name,
          room: p.room,
          spec: item.key,
          price: c.price,
          stock: c.stock,
          qty: item.qty,
        };
      })
    );
    const cartCount = computed(() => cart.value.reduce((s, i) => s + i.qty, 0));
    const subtotal = computed(() => cartLines.value.reduce((s, l) => s + l.price * l.qty, 0));
    const shipLabel = computed(() => (SHIP_MODES.find((m) => m.id === shipMode.value) || SHIP_MODES[0]).label);
    const shipFee = computed(() => shipFeeOf(shipMode.value, subtotal.value));
    const grandTotal = computed(() => subtotal.value + shipFee.value);

    function addToCart(pid, key, n) {
      const hit = cart.value.find((i) => i.pid === pid && i.key === key);
      const p = PRODUCTS.find((x) => x.id === pid);
      const c = p.combos.find((x) => x.v.join("/") === key);
      const cap = c.stock;
      if (cap === 0) {
        say("这个规格已售罄");
        return false;
      }
      if (hit) hit.qty = Math.min(cap, hit.qty + n);
      else cart.value.push({ pid: pid, key: key, qty: Math.min(cap, n) });
      return true;
    }

    function addCurrent() {
      const p = current.value;
      if (combo.value.stock === 0) {
        say("这个规格已售罄，换一个规格");
        return;
      }
      if (addToCart(p.id, combo.value.v.join("/"), qty.value)) {
        say("已加入购物车：" + p.name + " × " + qty.value);
      }
    }

    function quickAdd(p) {
      if (p.state === "soldout") {
        say(p.name + " 已售罄");
        return;
      }
      const live = p.combos.filter((c) => c.stock > 0);
      const c = live[0];
      if (addToCart(p.id, c.v.join("/"), 1)) say("已加入购物车：" + p.name);
    }

    function setQty(line, v) {
      const item = cart.value.find((i) => i.pid + "|" + i.key === line.key);
      if (!item) return;
      const n = Number(v) || 1;
      item.qty = Math.max(1, Math.min(line.stock, n));
    }

    function removeLine(line) {
      cart.value = cart.value.filter((i) => i.pid + "|" + i.key !== line.key);
      say("已移除 " + line.name);
      if (!cart.value.length) focusEl("cart-h");
    }

    function goCart() {
      focusEl("cart-h");
    }
    function goCatalogue() {
      focusEl("cat-h");
    }
    function goCheckout() {
      if (!cart.value.length) {
        say("购物车是空的，先加一件");
        return;
      }
      focusEl(order.value ? "co-h" : "f-name");
    }

    // ---------- 结算 ----------
    function validate() {
      errors.name = form.name.trim().length >= 2 ? "" : "请填收货人姓名，至少 2 个字";
      errors.phone = /^1[3-9]\d{9}$/.test(form.phone.trim()) ? "" : "请填 11 位手机号，例如 13800138000";
      if (!form.city) errors.city = "请选择城市";
      else if (form.city === "乌鲁木齐" || form.city === "拉萨") errors.city = "这两个城市暂不配送，换一个城市试试";
      else errors.city = "";
      errors.addr = form.addr.trim().length >= 6 ? "" : "请填详细地址，至少 6 个字";
      errors.agree = form.agree ? "" : "下单前请先确认这是演示页面";
      return !Object.keys(errors).some((k) => errors[k]);
    }

    function submitOrder() {
      if (!cart.value.length) {
        say("购物车是空的，先加一件");
        focusEl("cart-h");
        return;
      }
      if (!validate()) {
        const order = ["name", "phone", "city", "addr", "agree"];
        const first = order.find((k) => errors[k]);
        const map = { name: "f-name", phone: "f-phone", city: "f-city", addr: "f-addr", agree: "f-agree" };
        const holder = document.getElementById(map[first]);
        const target = holder ? (holder.matches("input, button") ? holder : holder.querySelector("input, button")) : null;
        if (target) target.focus();
        say("表单还有 " + order.filter((k) => errors[k]).length + " 处要改");
        return;
      }
      const stamp = new Date();
      order.value = {
        id: "DEMO-" + stamp.getFullYear() + String(stamp.getMonth() + 1).padStart(2, "0") + String(stamp.getDate()).padStart(2, "0") + "-" + String(1000 + Math.floor(Math.random() * 9000)),
        count: cartCount.value,
        subtotal: subtotal.value,
        fee: shipFee.value,
        total: grandTotal.value,
        shipLabel: shipLabel.value,
        name: form.name.trim(),
        city: form.city,
        addr: form.addr.trim(),
      };
      cart.value = [];
      focusEl("co-h");
      say("订单已提交（演示，不收款不发货）");
    }

    function resetOrder() {
      order.value = null;
      Object.assign(errors, { name: "", phone: "", city: "", addr: "", agree: "" });
      focusEl("f-name");
    }

    // ---------- ⌘K ----------
    const paletteResults = computed(() => {
      const q = paletteQuery.value.trim().toLowerCase();
      const base = q
        ? PRODUCTS.filter((p) => (p.name + p.material + p.roomName + p.blurb).toLowerCase().indexOf(q) !== -1)
        : PRODUCTS.slice().sort((a, b) => b.reviewCount - a.reviewCount);
      return base.slice(0, 6);
    });

    function openPalette() {
      paletteTrigger.value = document.activeElement;
      paletteOpen.value = true;
      paletteQuery.value = "";
      paletteIndex.value = 0;
      nextTick(() => {
        const c = paletteInput.value;
        if (c && c.focus) c.focus();
      });
    }

    function closePalette() {
      paletteOpen.value = false;
      nextTick(() => {
        const t = paletteTrigger.value;
        if (t && t.focus) t.focus();
      });
    }

    function pickPalette(p) {
      const trigger = paletteTrigger.value;
      paletteOpen.value = false;
      selectedId.value = p.id;
      qty.value = 1;
      nextTick(() => {
        if (trigger && trigger.focus) trigger.focus();
        focusEl("detail-h");
      });
    }

    function onPaletteKey(e) {
      if (e.key === "Escape") {
        e.preventDefault();
        closePalette();
        return;
      }
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        const n = paletteResults.value.length;
        if (!n) return;
        paletteIndex.value = (paletteIndex.value + (e.key === "ArrowDown" ? 1 : n - 1)) % n;
        return;
      }
      if (e.key === "Enter") {
        const p = paletteResults.value[paletteIndex.value];
        if (p) {
          e.preventDefault();
          pickPalette(p);
        }
        return;
      }
      if (e.key === "Tab") {
        const panel = e.currentTarget;
        const items = Array.prototype.slice
          .call(panel.querySelectorAll("input, button, [tabindex]:not([tabindex='-1'])"))
          .filter((el) => !el.disabled && el.offsetParent !== null);
        if (!items.length) return;
        const first = items[0];
        const last = items[items.length - 1];
        if (e.shiftKey && document.activeElement === first) {
          e.preventDefault();
          last.focus();
        } else if (!e.shiftKey && document.activeElement === last) {
          e.preventDefault();
          first.focus();
        }
      }
    }

    onMounted(() => {
      setTimeout(() => (loading.value = false), 420);
      window.addEventListener("keydown", (e) => {
        if ((e.metaKey || e.ctrlKey) && (e.key === "k" || e.key === "K")) {
          e.preventDefault();
          if (paletteOpen.value) closePalette();
          else openPalette();
        }
      });
    });

    return {
      rooms, total, bands, sortOptions, cities, shipModes,
      query, room, band, sort, inStockOnly, loading,
      visible, resultCount, filtersOn, filterChips, picks,
      current, chosen, combo, chosenText, comboText, stockState, qty,
      cart, cartLines, cartCount, subtotal, shipFee, grandTotal, shipLabel, shipMode,
      form, errors, order,

      <p>数值来源：TDesign 设计规范（颜色、字体、布局、动效四篇）与 UISpecs 项目库的场景点；每个数值都记在 DECISIONS.md 的取值记录里，带 content/ 完整路径与行号。</p>
      <div class="foot__rule" aria-hidden="true"></div>
      <p class="foot__meta">
        <span>版本 2026.11.14 · 案例稿</span>
        <span>26 件商品 / 5 个房间分类</span>
        <span>无障碍：正文对比度 ≥ 4.5:1，键盘可走完全流程</span>

<div class="cmdk" v-if="paletteOpen" role="dialog" aria-modal="true" aria-labelledby="cmdk-h" @keydown="onPaletteKey">
  <div class="cmdk__bg" @click="closePalette" aria-hidden="true"></div>
  <div class="cmdk__panel">
    <h2 class="cmdk__h" id="cmdk-h">搜索商品</h2>
    <div class="cmdk__field">
      <t-input ref="paletteInput" id="palette-q" v-model="paletteQuery" clearable
               placeholder="名称、材质或房间" aria-label="搜索关键词"></t-input>
      <kbd>esc</kbd>
    </div>
    <p class="cmdk__hint">{{ paletteResults.length }} 条匹配 · ↑↓ 选 · Enter 打开 · Esc 关闭</p>
    <ul class="cmdk__list" role="listbox" aria-label="搜索结果">
      <li v-for="(p, i) in paletteResults" :key="p.id" role="none">
        <button type="button" class="cmdk__item" role="option" :aria-selected="i === paletteIndex ? 'true' : 'false'"
                :class="{ 'is-on': i === paletteIndex }"
                @click="pickPalette(p)" @mousemove="paletteIndex = i">
          <span>{{ p.name }}</span>
          <small>¥{{ p.priceFrom }} · {{ roomName(p.room) }}</small>
        </button>
      </li>
    </ul>
    <p class="cmdk__empty" v-if="!paletteResults.length">没有匹配的商品，换个词试试，比如「藤」「木」「亚麻」。</p>
  </div>
</div>

<div class="toast" role="status" aria-live="polite" v-if="toast">{{ toast }}</div>
